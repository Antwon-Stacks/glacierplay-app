<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GlacierPlay Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* Splash Screen Overlay */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b0f19;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        #splash-screen video {
            width: 120px;
            height: 120px;
            border-radius: 24px;
            object-fit: cover;
            margin-bottom: 20px;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
        }

        #splash-screen h1 {
            font-size: 1.8rem;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* App Container */
        .app-container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Header / Nav */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand img, .brand-fallback {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            object-fit: cover;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        .brand span {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .wallet-badge {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: #38bdf8;
            font-weight: 600;
        }

        /* Reward Container Layout Update */
        .reward-container {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: rgba(15, 23, 42, 0.85);
            border-radius: 16px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #fff;
            width: 100%;
            box-sizing: border-box;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .check-in-btn {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
            transition: all 0.2s ease;
        }

        .check-in-btn:active {
            transform: scale(0.98);
        }

        .check-in-btn.claimed {
            background: rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            box-shadow: none;
            cursor: default;
        }

        /* Game Library Grid */
        .section-title {
            font-size: 1rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .game-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            text-decoration: none;
            color: inherit;
        }

        .game-card:hover {
            transform: translateY(-3px);
            border-color: rgba(56, 189, 248, 0.5);
        }

        .game-thumb {
            width: 100%;
            height: 110px;
            border-radius: 10px;
            background: #1e293b;
            object-fit: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
        }

        .game-name {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .game-genre {
            font-size: 0.75rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <video id="splashVideo" src="splash.mp4" muted playsinline autoplay></video>
        <h1>GLACIERPLAY</h1>
    </div>

    <div class="app-container">
        <header class="app-header">
            <div class="brand">
                <img src="1786404293997.png" alt="Logo" onerror="this.style.display='none'; document.getElementById('logoFallback').style.display='flex';">
                <div id="logoFallback" class="brand-fallback" style="display:none;">🧊</div>
                <span>GlacierPlay</span>
            </div>
            <div class="wallet-badge">
                🔑 <span id="key-count">0</span> Keys
            </div>
        </header>

        <div class="reward-container">
            <div style="width: 100%; text-align: center; margin-bottom: 20px;">
                <div style="font-size: 0.85rem; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;">Daily Mission</div>
                <button id="checkInBtn" class="check-in-btn" onclick="handleCheckIn()">
                    Claim +1 Key
                </button>
                <div id="mission-timer" style="font-size: 0.75rem; color: #94a3b8; margin-top: 8px;">Resets in 24h 00m 00s</div>
            </div>

            <div style="width: 100%; text-align: center; border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 15px; margin-top: auto;">
                <div style="font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px;">Active Streak</div>
                <div style="font-size: 1.25rem; font-weight: bold; color: #38bdf8; margin-top: 4px;">
                    🔥 <span id="streak-count">0</span> Days
                </div>
            </div>
        </div>

        <div class="section-title">Arcade Library</div>
        <div class="game-grid">
            <a href="#" class="game-card" onclick="alert('Launching 8-Bit Track...'); return false;">
                <img src="track-thumb.png" class="game-thumb" alt="8-Bit Track" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="game-thumb" style="display:none; background: linear-gradient(135deg, #0369a1, #0284c7);">🏃‍♂️</div>
                <div>
                    <div class="game-name">8-Bit Track</div>
                    <div class="game-genre">Sports / Arcade</div>
                </div>
            </a>

            <a href="#" class="game-card" onclick="alert('Launching Glacier Dash...'); return false;">
                <img src="game2-thumb.png" class="game-thumb" alt="Game 2" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="game-thumb" style="display:none; background: linear-gradient(135deg, #0e7490, #164e63);">❄️</div>
                <div>
                    <div class="game-name">Glacier Dash</div>
                    <div class="game-genre">Endless Runner</div>
                </div>
            </a>

            <a href="#" class="game-card" onclick="alert('Launching Frost Climb...'); return false;">
                <img src="game3-thumb.png" class="game-thumb" alt="Game 3" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="game-thumb" style="display:none; background: linear-gradient(135deg, #155e75, #082f49);">🧗‍♂️</div>
                <div>
                    <div class="game-name">Frost Climb</div>
                    <div class="game-genre">Platformer</div>
                </div>
            </a>

            <a href="#" class="game-card" onclick="alert('Launching Ice Breaker...'); return false;">
                <img src="game4-thumb.png" class="game-thumb" alt="Game 4" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="game-thumb" style="display:none; background: linear-gradient(135deg, #1e3a8a, #1e1b4b);">🧊</div>
                <div>
                    <div class="game-name">Ice Breaker</div>
                    <div class="game-genre">Puzzle Arcade</div>
                </div>
            </a>
        </div>
    </div>

    <script>
        // Splash screen dismissal timer (4.5 seconds)
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 500);
            }, 4500);
            initVault();
        });

        // Vault & Streak State Management
        let vaultData = {
            keys: 0,
            streak: 0,
            lastCheckInDate: null
        };

        function getEstTime() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            // EST offset: -5 hours (simplified local check-in baseline)
            const est = new Date(utc - (5 * 3600000));
            const dateStr = est.toISOString().split('T')[0];
            const midnight = new Date(est);
            midnight.setHours(24, 0, 0, 0);
            const msToMidnight = midnight.getTime() - est.getTime();
            return { dateStr, msToMidnight };
        }

        function initVault() {
            const saved = localStorage.getItem('glacierPlayVault');
            if (saved) {
                try { vaultData = JSON.parse(saved); } catch(e) {}
            }
            updateUI();
        }

        function saveVault() {
            localStorage.setItem('glacierPlayVault', JSON.stringify(vaultData));
            updateUI();
        }

        function handleCheckIn() {
            const est = getEstTime();
            if (vaultData.lastCheckInDate === est.dateStr) return;

            // Check streak continuity
            if (vaultData.lastCheckInDate) {
                const lastDate = new Date(vaultData.lastCheckInDate);
                const currDate = new Date(est.dateStr);
                const diffDays = Math.round((currDate - lastDate) / (1000 * 60 * 60 * 24));
                if (diffDays === 1) {
                    vaultData.streak += 1;
                } else if (diffDays > 1) {
                    vaultData.streak = 1;
                }
            } else {
                vaultData.streak = 1;
            }

            vaultData.keys += (vaultData.streak % 7 === 0) ? 2 : 1;
            vaultData.lastCheckInDate = est.dateStr;
            saveVault();
        }

        function updateUI() {
            const est = getEstTime();
            document.getElementById('key-count').innerText = vaultData.keys;
            document.getElementById('streak-count').innerText = vaultData.streak;

            const btn = document.getElementById('checkInBtn');
            const timerText = document.getElementById('mission-timer');

            if (vaultData.lastCheckInDate === est.dateStr) {
                btn.classList.add('claimed');
                btn.innerText = "Claimed ✓";
                
                const hrs = Math.floor(est.msToMidnight / (1000 * 60 * 60));
                const mins = Math.floor((est.msToMidnight % (1000 * 60 * 60)) / (1000 * 60));
                const secs = Math.floor((est.msToMidnight % (1000 * 60)) / 1000);
                timerText.innerText = `Resets in ${hrs}h ${mins}m ${secs}s`;
            } else {
                btn.classList.remove('claimed');
                const nextStreak = vaultData.lastCheckInDate ? vaultData.streak + 1 : 1;
                btn.innerText = (nextStreak % 7 === 0) ? "Claim +2 Keys" : "Claim +1 Key";
                timerText.innerText = "Available Now!";
            }
        }

        // Live timer tick every second
        setInterval(updateUI, 1000);
    </script>
</body>
</html>
