<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GlacierPlay Hub</title>
    <style>
        /* Base Styling & Theme */
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: #050B14;
            color: #FFFFFF;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            user-select: none;
            -webkit-touch-callout: none;
        }

        /* Splash Screen Overlay */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #050B14;
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.5s ease-out;
        }
        #splashVideo { width: 100%; height: 100%; object-fit: cover; }

        /* App Container Architecture */
        .app-view {
            max-width: 480px; margin: 0 auto;
            padding: 20px; padding-bottom: 80px;
        }

        #hub-container { display: none; }
        #rewards-container { display: none; }

        /* App Header & Vault Balance */
        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 24px;
        }
        .logo { height: 38px; width: auto; object-fit: contain; }

        .vault-pill {
            background: linear-gradient(90deg, #1A2639 0%, #233550 100%);
            border: 1px solid #3A4E6C;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 15px;
            display: flex; align-items: center; gap: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer; transition: transform 0.1s;
        }
        .vault-pill:active { transform: scale(0.95); }
        .vault-pill span { color: #00f2fe; }

        /* Section Headers */
        .section-header {
            display: flex; justify-content: space-between; align-items: flex-end;
            margin-bottom: 12px; margin-top: 15px;
        }
        .section-title { font-size: 18px; font-weight: 700; color: #E2E8F0; }
        .section-subtitle { font-size: 12px; color: #A0AEC0; font-weight: 600; }

        /* Unified Daily Check-in & Streak Box */
        .daily-wrapper-card {
            background-color: #121C2B;
            border: 1px solid #233550;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* Infinite Streak Banner Inside Box - UPDATED MARGINS FOR BOTTOM LAYOUT */
        .streak-banner {
            background: linear-gradient(135deg, #FF4B2B 0%, #FF416C 100%);
            border-radius: 12px;
            padding: 14px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 0; 
            box-shadow: 0 4px 12px rgba(255, 65, 108, 0.25);
        }
        .streak-info h3 { margin: 0; font-size: 16px; font-weight: 800; }
        .streak-info p { margin: 2px 0 0 0; font-size: 11px; opacity: 0.9; }
        .streak-flame { font-size: 28px; }

        /* 7-Day Timeline Visuals */
        .streak-timeline {
            display: flex; justify-content: space-between; gap: 6px;
            margin-bottom: 16px;
        }
        .streak-day {
            flex: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #233550;
            border-radius: 8px;
            padding: 8px 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
            font-size: 11px; color: #A0AEC0;
            transition: all 0.2s;
        }
        .streak-day.completed {
            background: rgba(0, 242, 254, 0.1); border-color: rgba(0, 242, 254, 0.3); color: #00f2fe;
        }
        .streak-day.active {
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.2) 0%, rgba(79, 172, 254, 0.2) 100%);
            border-color: #00f2fe; color: #fff;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.4); transform: scale(1.05);
        }
        .streak-day.day-7 { border-color: #FFD700; background: rgba(255, 215, 0, 0.05); }
