<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GlacierPlay Hub</title>
    <style>
        /* Base Styling & Theme */
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: #050B14;
            color: #FFFFFF;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            user-select: none;
            -webkit-touch-callout: none;
        }

        /* Splash Screen Overlay */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #050B14;
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; transition: opacity 0.5s ease-out;
        }
        #splashVideo { width: 100%; height: 100%; object-fit: cover; }

        /* Main App Hub Architecture */
        #hub-container {
            display: none; max-width: 480px; margin: 0 auto;
            padding: 20px; padding-bottom: 80px;
        }

        /* App Header & Vault Balance */
        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 24px;
        }
        .logo { height: 38px; width: auto; object-fit: contain; }
        
        .vault-pill {
            background: linear-gradient(90deg, #1A2639 0%, #233550 100%);
            border: 1px solid #3A4E6C;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 15px;
            display: flex; align-items: center; gap: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .vault-pill span { color: #00f2fe; }

        /* Section Headers */
        .section-header {
            display: flex; justify-content: space-between; align-items: flex-end;
            margin-bottom: 12px; margin-top: 15px;
        }
        .section-title { font-size: 18px; font-weight: 700; color: #E2E8F0; }
        .section-subtitle { font-size: 12px; color: #A0AEC0; font-weight: 600; }

        /* Daily Check-in Card */
        .mission-card {
            background-color: #121C2B;
            border: 1px solid #233550;
            border-radius: 14px;
            padding: 16px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 14px;
        }
        .mission-text h4 { margin: 0; font-size: 15px; color: #fff; }
        .mission-text p { margin: 4px 0 0 0; font-size: 12px; color: #A0AEC0; }
        
        .mission-btn {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #050B14; border: none; padding: 10px 16px;
            border-radius: 10px; font-size: 14px; font-weight: 800;
            cursor: pointer; transition: transform 0.1s;
        }
        .mission-btn:active { transform: scale(0.95); }
        .mission-btn.claimed {
            background: #233550; color: #A0AEC0; cursor: not-allowed;
        }

        /* Infinite Streak Banner (Positioned Directly Under Check-In) */
        .streak-banner {
            background: linear-gradient(135deg, #FF4B2B 0%, #FF416C 100%);
            border-radius: 14px;
            padding: 16px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 24px;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.3);
        }
        .streak-info h3 { margin: 0; font-size: 18px; font-weight: 800; }
        .streak-info p { margin: 4px 0 0 0; font-size: 12px; opacity: 0.9; }
        .streak-flame { font-size: 32px; }

        /* Rewards Store (3 Tiers: 20, 50, 100 Keys) */
        .store-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            margin-bottom: 35px;
        }
        .chest-card {
            background-color: #121C2B; border: 1px solid #233550;
            border-radius: 12px; padding: 16px 8px;
            display: flex; flex-direction: column; align-items: center; text-align: center;
            transition: transform 0.1s; cursor: pointer;
        }
        .chest-card:active { transform: scale(0.95); }
        .chest-icon { font-size: 36px; margin-bottom: 8px; }
        .chest-name { font-size: 12px; font-weight: 700; margin-bottom: 6px; color: #E2E8F0; }
        
        .chest-price {
            background: rgba(0, 242, 254, 0.1); border: 1px solid rgba(0, 242, 254, 0.3);
            color: #00f2fe; padding: 4px 10px; border-radius: 8px;
            font-size: 11px; font-weight: 800; width: 100%;
        }

        .tier-basic { border-top: 3px solid #CD7F32; }   /* 20 Keys */
        .tier-rare { border-top: 3px solid #C0C0C0; }    /* 50 Keys */
        .tier-epic { border-top: 3px solid #FFD700; }    /* 100 Keys */

        /* Game Grid Styling */
        .game-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
        .game-card {
            background-color: #121C2B; border-radius: 16px; overflow: hidden;
            text-decoration: none; color: white; display: flex; flex-direction: column;
            border: 1px solid #233550; transition: transform 0.1s;
        }
        .game-card:active { transform: scale(0.95); }
        .game-thumb { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-bottom: 1px solid #233550; }
        .game-title { padding: 10px; font-size: 13px; font-weight: 700; text-align: center; color: #E2E8F0; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <video id="splashVideo" autoplay muted playsinline onerror="handleVideoError()">
            <source src="Glacier Play loading screen.mp4" type="video/mp4">
            <source src="Glacier%20Play%20loading%20screen.mp4" type="video/mp4">
        </video>
        <div id="splash-fallback" style="display:none; text-align:center;">
            <img src="header-logo.png" alt="GlacierPlay" style="width: 150px; margin-bottom: 20px;" onerror="this.style.display='none'">
            <div style="font-weight: 700; color: #00f2fe; letter-spacing: 1px;">GLACIERPLAY HUB</div>
        </div>
    </div>

    <div id="hub-container">
        
        <header>
            <img src="header-logo.png" alt="GlacierPlay" class="logo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'140\' height=\'38\'><rect width=\'140\' height=\'38\' rx=\'6\' fill=\'%23121C2B\'/><text x=\'50%\' y=\'50%\' dominant-baseline=\'middle\' text-anchor=\'middle\' fill=\'white\' font-family=\'sans-serif\' font-size=\'14\' font-weight=\'bold\'>GLACIERPLAY</text></svg>'">
            <div class="vault-pill">
                🗝️ <span id="keys-balance">0</span>
            </div>
        </header>

        <div class="section-header">
            <div class="section-title">Daily Check-in</div>
            <div class="section-subtitle">Resets at Midnight EST</div>
        </div>
        
        <div class="mission-card">
            <div class="mission-text">
                <h4>Daily Vault Check-in</h4>
                <p id="mission-timer">Reward available now</p>
            </div>
            <button id="checkInBtn" class="mission-btn" onclick="claimDailyCheckIn()">+1 Key</button>
        </div>

        <div class="streak-banner">
            <div class="streak-info">
                <h3><span id="streak-count">0</span> Day Streak!</h3>
                <p>Keep the flame alive daily.</p>
            </div>
            <div class="streak-flame">🔥</div>
        </div>

        <div class="section-header">
            <div class="section-title">Rewards Store</div>
            <div class="section-subtitle">Open Chests</div>
        </div>

        <div class="store-grid">
            <div class="chest-card tier-basic" onclick="openChest('Basic', 20)">
                <div class="chest-icon">📦</div>
                <div class="chest-name">Basic Chest</div>
                <div class="chest-price">20 Keys</div>
            </div>
            <div class="chest-card tier-rare" onclick="openChest('Rare', 50)">
                <div class="chest-icon">🧰</div>
                <div class="chest-name">Rare Chest</div>
                <div class="chest-price">50 Keys</div>
            </div>
            <div class="chest-card tier-epic" onclick="openChest('Epic', 100)">
                <div class="chest-icon">👑</div>
                <div class="chest-name">Epic Chest</div>
                <div class="chest-price">100 Keys</div>
            </div>
        </div>

        <div class="section-header">
            <div class="section-title">Arcade Library</div>
        </div>
        <div class="game-grid">
            <a href="track.html" class="game-card">
                <img src="track-thumb.png" alt="8-Bit Track" class="game-thumb" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'200\' height=\'200\'><rect width=\'200\' height=\'200\' fill=\'%23233550\'/><text x=\'50%\' y=\'50%\' dominant-baseline=\'middle\' text-anchor=\'middle\' fill=\'%2300f2fe\' font-family=\'sans-serif\' font-size=\'16\' font-weight=\'bold\'>8-BIT TRACK</text></svg>'">
                <div class="game-title">8-Bit Track</div>
            </a>
            <a href="#" class="game-card">
                <img src="game2-thumb.png" alt="Glacier Dash" class="game-thumb" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'200\' height=\'200\'><rect width=\'200\' height=\'200\' fill=\'%23233550\'/><text x=\'50%\' y=\'50%\' dominant-baseline=\'middle\' text-anchor=\'middle\' fill=\'%23A0AEC0\' font-family=\'sans-serif\' font-size=\'14\'>Glacier Dash</text></svg>'">
                <div class="game-title">Glacier Dash</div>
            </a>
        </div>
    </div>

    <script>
        function handleVideoError() {
            console.warn("Splash video failed to load. Showing fallback view.");
            document.getElementById('splashVideo').style.display = 'none';
            document.getElementById('splash-fallback').style.display = 'block';
        }

        // 1. Splash Screen Timing Sequence (4.5s)
        document.addEventListener('DOMContentLoaded', () => {
            const splashScreen = document.getElementById('splash-screen');
            const hubContainer = document.getElementById('hub-container');

            loadVaultState();

            setTimeout(() => {
                splashScreen.style.opacity = '0';
                setTimeout(() => {
                    splashScreen.style.display = 'none';
                    hubContainer.style.display = 'block';
                }, 500);
            }, 4500); 

            setInterval(updateCheckInUI, 1000);
        });

        // 2. Vault Engine
        let vaultData = {
            keys: 0,
            streakCount: 0,
            lastCheckInDate: "" // YYYY-MM-DD format in EST
        };

        // Helper to get current EST date string and ms remaining until midnight EST
        function getESTDetails() {
            const now = new Date();
            const estString = new Intl.DateTimeFormat('en-US', {
                timeZone: 'America/New_York',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            }).format(now);

            const parts = estString.match(/(\d+)\/(\d+)\/(\d+),\s*(\d+):(\d+):(\d+)/);
            if (!parts) return { dateStr: "", msToMidnight: 0 };

            const month = parts[1];
            const day = parts[2];
            const year = parts[3];
            const hour = parseInt(parts[4], 10);
            const minute = parseInt(parts[5], 10);
            const second = parseInt(parts[6], 10);

            const currentDateStr = `${year}-${month}-${day}`;

            const currentSecondsInDay = (hour * 3600) + (minute * 60) + second;
            const secondsToMidnight = 86400 - currentSecondsInDay;
            const msToMidnight = secondsToMidnight * 1000;

            return { dateStr: currentDateStr, msToMidnight: msToMidnight };
        }

        function loadVaultState() {
            const saved = localStorage.getItem('glacier_vault');
            if (saved) {
                try { vaultData = JSON.parse(saved); } catch(e) {}
            }
            
            const est = getESTDetails();
            if (vaultData.lastCheckInDate) {
                const lastDate = new Date(vaultData.lastCheckInDate);
                const currDate = new Date(est.dateStr);
                const diffDays = Math.round((currDate - lastDate) / (1000 * 60 * 60 * 24));

                if (diffDays > 2) {
                    // Missed more than 48 hours -> Reset streak
                    vaultData.streakCount = 0;
                }
            }
            updateCheckInUI();
        }

        function saveVaultState() {
            localStorage.setItem('glacier_vault', JSON.stringify(vaultData));
        }

        function claimDailyCheckIn() {
            const est = getESTDetails();

            if (vaultData.lastCheckInDate === est.dateStr) {
                return; // Already checked in today EST
            }

            if (vaultData.lastCheckInDate) {
                const lastDate = new Date(vaultData.lastCheckInDate);
                const currDate = new Date(est.dateStr);
                const diffDays = Math.round((currDate - lastDate) / (1000 * 60 * 60 * 24));

                if (diffDays > 2) {
                    vaultData.streakCount = 1;
                } else {
                    vaultData.streakCount += 1;
                }
            } else {
                vaultData.streakCount = 1;
            }

            vaultData.keys += 1;
            vaultData.lastCheckInDate = est.dateStr;

            alert(`🗝️ +1 Key Added to Vault!\n🔥 Streak is now ${vaultData.streakCount} Days!`);
            
            saveVaultState();
            updateCheckInUI();
        }

        // 3. Chest Opening Gacha Logic
        function openChest(tierName, cost) {
            if (vaultData.keys < cost) {
                alert(`Not enough Keys! You need ${cost} Keys to open the ${tierName} Chest.`);
                return;
            }

            if(confirm(`Spend ${cost} Keys to open the ${tierName} Chest?`)) {
                vaultData.keys -= cost;
                saveVaultState();
                updateCheckInUI();
                
                alert(`✨ OPENING ${tierName.toUpperCase()} CHEST (${cost} Keys)... ✨\n\n🎉 Congratulations! You unlocked a Mystery Reward!`);
            }
        }

        // 4. UI Real-time Updates with Midnight EST Countdown
        function updateCheckInUI() {
            document.getElementById('keys-balance').innerText = vaultData.keys;
            document.getElementById('streak-count').innerText = vaultData.streakCount || 0;

            const btn = document.getElementById('checkInBtn');
            const timerText = document.getElementById('mission-timer');

            const est = getESTDetails();

            if (vaultData.lastCheckInDate === est.dateStr) {
                btn.classList.add('claimed');
                btn.innerText = "Claimed ✓";
                
                const remainingMs = est.msToMidnight;
                const hoursLeft = Math.floor(remainingMs / (1000 * 60 * 60));
                const minsLeft = Math.floor((remainingMs % (1000 * 60 * 60)) / (1000 * 60));
                const secsLeft = Math.floor((remainingMs % (1000 * 60)) / 1000);
                
                timerText.innerText = `Resets in ${hoursLeft}h ${minsLeft}m ${secsLeft}s`;
            } else {
                btn.classList.remove('claimed');
                btn.innerText = "+1 Key";
                timerText.innerText = "Reward available now";
            }
        }
    </script>
</body>
</html>
