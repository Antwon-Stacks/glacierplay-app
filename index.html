<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GlacierPlay Game Hub</title>
    <style>
        /* --- CORE APP STYLING --- */
        body {
            margin: 0;
            padding: 0;
            background-color: #020813; /* Deep midnight navy */
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- SPLASH SCREEN (VIDEO) --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #020813;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease-out; /* Smooth fade-out effect */
        }

        #splash-video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Ensures the video fills the screen beautifully */
        }

        /* --- MAIN HUB DASHBOARD --- */
        #main-hub {
            display: none; /* Hidden until the video finishes */
            padding-bottom: 80px; /* Space for a future bottom nav bar */
        }

        /* The Top Header */
        header {
            width: 100%;
            padding: 20px 0;
            text-align: center;
            background: linear-gradient(180deg, #020813 0%, rgba(2,8,19,0) 100%);
        }

        .header-logo {
            max-height: 45px; /* Keeps the logo cleanly sized on mobile */
            width: auto;
        }

        /* Placeholder layout so you can see where things go next */
        .app-container {
            padding: 0 20px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #e0f2fe; /* Light icy blue text */
        }

        /* Placeholder Game Grid */
        .game-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .game-card-placeholder {
            background-color: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 16px;
            height: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #475569;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <video id="splash-video" autoplay muted playsinline>
            <source src="Glacier Play loading screen.mp4" type="video/mp4">
        </video>
    </div>

    <div id="main-hub">
        
        <header>
            <img src="header-logo.png" alt="GlacierPlay" class="header-logo">
        </header>

        <div class="app-container">
            <div class="section-title">Featured Arcade</div>
            
            <div class="game-grid">
                <div class="game-card-placeholder">Thumbnail slot</div>
                <div class="game-card-placeholder">Thumbnail slot</div>
                <div class="game-card-placeholder">Thumbnail slot</div>
                <div class="game-card-placeholder">Thumbnail slot</div>
            </div>
        </div>

    </div>

    <script>
        const splashScreen = document.getElementById('splash-screen');
        const mainHub = document.getElementById('main-hub');
        const splashVideo = document.getElementById('splash-video');

        // Function to smoothly transition from Splash to Hub
        function enterApp() {
            // First, make the hub visible in the background
            mainHub.style.display = 'block';
            
            // Fade out the splash screen
            splashScreen.style.opacity = '0';
            
            // Wait 800ms for the fade out to finish, then delete it to save memory
            setTimeout(() => {
                splashScreen.style.display = 'none';
            }, 800);
        }

        // TRIGGER 1: When the MP4 video naturally finishes playing
        splashVideo.onended = () => {
            enterApp();
        };

        // TRIGGER 2: Fallback safety net
        // Just in case a specific mobile browser blocks video autoplay, 
        // this will force the app to open after 4.5 seconds anyway.
        setTimeout(() => {
            if (splashScreen.style.opacity !== '0') {
                enterApp();
            }
        }, 4500); 

    </script>
</body>
</html>
